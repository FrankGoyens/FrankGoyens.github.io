<div class="retro-card retro-form retro-bug-form">
  <h2>Report a bug</h2>
  <!-- Remember enctype="multipart/form-data" is REQUIRED for images -->
  <form 
    action="https://formsubmit.co/your-email@mywebsite.com" 
    method="POST" 
    enctype="multipart/form-data"
    class="retro-form-panel"
  >

    <!-- Subject line for your inbox -->
    <input type="hidden" name="_subject" value="New Bug Report with Screenshot">

    <!-- Optional user contact info -->
    <label for="email">Your Email (optional):</label>
    <input type="email" name="email" id="email" placeholder="In case we need to follow up">

    <!-- Feedback details -->
    <label for="description">Describe the issue:</label>
    <textarea name="description" id="description" rows="4" required placeholder="What happened?"></textarea>

    <!-- Image Upload Field -->
    <label for="screenshot">Attach a Screenshot (PNG, JPG):</label>
    <input 
      type="file" 
      name="attachment" 
      id="screenshot" 
      accept="image/png, image/jpeg, image/webp"
    >

    <button type="submit">Submit Report</button>
    <p>
      Feedback and attached screenshots are processed securely via FormSubmit to help us improve our apps. 
      Read our <a href="/privacy" target="_blank">Privacy Policy</a>.
    </p>
  </form>
</div>
